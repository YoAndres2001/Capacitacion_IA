# =============================================================
#  Nexora - nginx - DESARROLLO
#  http://localhost:8088  -> frontend (Vite HMR)
#  /api/  /admin/         -> backend  (Django HTTP)
#  /ws/                   -> websocket (Daphne, contenedor aparte)
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker. Sin esto nginx resuelve los nombres una sola vez al
    # arrancar y devuelve 502 cuando un contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host   "backend:8000";
    set $websocket_host "websocket:8001";
    set $frontend_host  "frontend:5173";

    client_max_body_size 5G;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location = /health/nginx { access_log off; return 200 "ok\n"; }

    # -- WebSocket: contenedor independiente ---------------------
    location /ws/ {
        proxy_pass http://$websocket_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # -- API REST ------------------------------------------------
    location /api/ {
        proxy_pass http://$backend_host$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;      # cargas grandes en streaming
    }

    location /admin/ {
        proxy_pass http://$backend_host$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://$backend_host$request_uri;
        proxy_set_header Host $host;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Media protegida: Django autoriza y delega a nginx (X-Accel-Redirect)
    location /protected-media/ {
        internal;
        alias /var/www/media/;
    }

    # -- Frontend (Vite dev server + HMR) ------------------------
    location / {
        proxy_pass http://$frontend_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # HMR usa WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
    }
}

# ─────────────────────────────────────────────────────────────
#  Nexora · nginx · PRODUCCIÓN (TLS + réplicas)
# ─────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    location = /health/nginx { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;

    include /etc/nginx/snippets/security-headers.conf;

    # DNS interno de Docker: permite recrear o escalar contenedores sin que
    # nginx quede apuntando a una IP muerta (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host   "backend:8000";
    set $websocket_host "websocket:8001";
    set $frontend_host  "frontend:80";

    client_max_body_size 5G;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /health/nginx { access_log off; return 200 "ok\n"; }

    # ── WebSocket · contenedor independiente ────────────────
    location /ws/ {
        proxy_pass http://$websocket_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_request_buffering off;
    }

    location /admin/  { include /etc/nginx/snippets/proxy-backend.conf; }
    location /health/ { include /etc/nginx/snippets/proxy-backend.conf; access_log off; }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media privada: solo accesible vía X-Accel-Redirect emitido por Django
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        add_header Content-Disposition "attachment" always;
    }

    location / {
        proxy_pass http://$frontend_host$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
